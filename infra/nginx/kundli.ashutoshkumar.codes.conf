# Nginx server block for kundli.ashutoshkumar.codes
#
# Install to /etc/nginx/sites-available/ and symlink into sites-enabled/ (Debian/Ubuntu),
# or drop into /etc/nginx/conf.d/ (Amazon Linux). One app = one server block + one local
# backend port; future apps on ashutoshkumar.codes get their own file on the same host.
#
# With the single-jar build, Spring Boot serves BOTH the Angular SPA and /api, so Nginx's
# only jobs are TLS termination and reverse-proxying everything to 127.0.0.1:8080.

# --- HTTP: ACME challenge + redirect everything else to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name kundli.ashutoshkumar.codes;

    # Let's Encrypt webroot challenge (see infra/DEPLOY.md for the certbot command).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: TLS termination + reverse proxy ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kundli.ashutoshkumar.codes;

    ssl_certificate     /etc/letsencrypt/live/kundli.ashutoshkumar.codes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kundli.ashutoshkumar.codes/privkey.pem;
    # Managed by certbot's package; keeps protocols/ciphers current.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Birth/PDF payloads are tiny; keep a sane cap.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
