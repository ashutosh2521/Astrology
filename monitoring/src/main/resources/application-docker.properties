# Container profile — active only when SPRING_PROFILES_ACTIVE=docker (set by
# infra/docker-compose.yml). Inert for the systemd/jar deployment.
#
# Bind the dashboard to all interfaces INSIDE the container. The host publishes it only on
# 127.0.0.1:9090 (see docker-compose.yml), so it stays loopback-only on the host and is
# reached over an SSH tunnel exactly as in the systemd setup.
server.address=0.0.0.0
