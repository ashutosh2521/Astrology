spring.application.name=kundli-monitoring
# Run on the servlet stack (the Admin server starter also pulls in WebFlux); the
# SecurityConfig is servlet-based, so pin this to avoid a reactive context.
spring.main.web-application-type=servlet

# Loopback-only: the dashboard is reached over an SSH tunnel, never exposed publicly.
server.address=127.0.0.1
server.port=${KUNDLI_ADMIN_PORT:9090}

# --- Dashboard login (override both via /etc/kundli/admin.env) ---
spring.security.user.name=${KUNDLI_ADMIN_USER:admin}
spring.security.user.password=${KUNDLI_ADMIN_PASSWORD:changeme}

# --- Email notifications on status change (DOWN / UP / OFFLINE) ---
# The mail notifier activates only when an SMTP host is set; until then the dashboard
# still works, it just won't send email.
spring.mail.host=${KUNDLI_SMTP_HOST:}
spring.mail.port=${KUNDLI_SMTP_PORT:587}
spring.mail.username=${KUNDLI_SMTP_USER:}
spring.mail.password=${KUNDLI_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.boot.admin.notify.mail.enabled=${KUNDLI_MAIL_NOTIFY_ENABLED:true}
spring.boot.admin.notify.mail.to=${KUNDLI_ALERT_TO:}
spring.boot.admin.notify.mail.from=${KUNDLI_ALERT_FROM:kundli-monitor@ashutoshkumar.codes}

# This server's own health is informational; don't lock it behind auth for the tunnel check.
management.endpoints.web.exposure.include=health,info
# The mail *notifier* is what sends alerts; the mail *health indicator* only pings SMTP and
# would drag this server's health to DOWN when email is unconfigured or SMTP is briefly
# unreachable. Disable it so /actuator/health reflects the monitoring server itself.
management.health.mail.enabled=false
