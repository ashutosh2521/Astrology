# Test datasource: throwaway SQLite file under target/, fresh schema per run.
spring.datasource.url=jdbc:sqlite:target/test-kundli.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.hibernate.ddl-auto=create

kundli.ephemeris.base-url=http://127.0.0.1:8001
kundli.boundary-warning-degrees=1.0
kundli.historical-tz-warning-before-year=1950

# Rule-system metadata (mirrors main; tests assert we surface these values).
kundli.rules.ayanamsa=LAHIRI
kundli.rules.matching-system=NORTH_INDIAN_ASHTAKOOTA
kundli.rules.ashtakoota-rule-version=ashtakoot-v0-provisional
kundli.rules.manglik-rule-version=manglik-v1.1
kundli.rules.ephemeris-mode=SWISS_EPHEMERIS_FULL
