# Container profile — active only when SPRING_PROFILES_ACTIVE=docker (set by
# infra/docker-compose.yml). Overrides just the bits that change when the services talk
# over the Docker network instead of 127.0.0.1. Inert for the systemd/jar deployment.
#
# The two service URLs (ephemeris + admin) are supplied as environment variables in
# docker-compose.yml (KUNDLI_EPHEMERIS_BASEURL, KUNDLI_ADMIN_URL); this file covers the
# properties that have no env hook.

# Actuator must be reachable by the monitoring container, so bind all interfaces INSIDE
# this container. Port 8081 is never published to the host, so it stays internal-only.
management.server.address=0.0.0.0

# Tell Spring Boot Admin how to reach this backend by its compose service name, instead of
# the auto-detected container IP/hostname the client would otherwise register.
spring.boot.admin.client.instance.service-base-url=http://backend:8080
spring.boot.admin.client.instance.management-base-url=http://backend:8081
