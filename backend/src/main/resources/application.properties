# --- Datasource: SQLite file on disk (portable schema; Postgres is the upgrade path) ---
spring.datasource.url=jdbc:sqlite:${KUNDLI_DB_PATH:./data/kundli.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Single-writer engine: one connection avoids SQLITE_BUSY under concurrent writes.
spring.datasource.hikari.maximum-pool-size=1
# Personal-scale pragmatism for v1; revisit with a migration tool (Flyway) if schema churn grows.
spring.jpa.hibernate.ddl-auto=update

# --- Ephemeris service (internal-only, localhost) ---
kundli.ephemeris.base-url=http://127.0.0.1:8001

# --- Accuracy policy (owned here, not in the ephemeris service) ---
# Warn when the Moon sits within this many degrees of a Nakshatra/Rashi boundary
# (spec: ~1 degree; small birth-time errors can flip the placement).
kundli.boundary-warning-degrees=1.0
# Births before this year get a timezone-reliability warning (historical UTC offsets,
# especially in India, are not fully covered by IANA tz rules).
kundli.historical-tz-warning-before-year=1950

# --- Declared rule system (surfaced on every match result) ---
# One declared, versioned convention per the spec — never a silent mix of sources.
# See docs/MILESTONE1_AUDIT.md and backend/VERIFICATION.md for what "provisional" still gates.
kundli.rules.ayanamsa=LAHIRI
kundli.rules.matching-system=NORTH_INDIAN_ASHTAKOOTA
kundli.rules.ashtakoota-rule-version=ashtakoot-v0-provisional
kundli.rules.manglik-rule-version=manglik-v1.1
kundli.rules.ephemeris-mode=SWISS_EPHEMERIS_FULL

server.port=8080
