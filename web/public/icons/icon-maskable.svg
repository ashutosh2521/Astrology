<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Kundli मिलान">
  <!--
    Maskable app icon — full-bleed dark background so Android launchers
    can crop it to any shape (circle, squircle, rounded square). The gold
    mark is scaled to sit inside the safe zone (central ~80%).
  -->
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f6dfa0"/>
      <stop offset="45%"  stop-color="#d9a943"/>
      <stop offset="100%" stop-color="#9a6a22"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#e0b459"/>
      <stop offset="100%" stop-color="#a5741f"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="80%">
      <stop offset="0%"   stop-color="#20233a"/>
      <stop offset="55%"  stop-color="#141628"/>
      <stop offset="100%" stop-color="#0d0e17"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f6dfa0" stop-opacity="0.35"/>
      <stop offset="70%"  stop-color="#d9a943" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#d9a943" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed backdrop (no rounded corners — launcher masks it) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- Mark scaled to ~0.78 to stay within the maskable safe zone -->
  <g transform="translate(256 256) scale(0.78)">
    <g fill="none" stroke="url(#goldSoft)" stroke-width="5"
       stroke-linecap="round" opacity="0.5">
      <g id="petal-set">
        <path d="M0,-186 C22,-158 22,-128 0,-108 C-22,-128 -22,-158 0,-186 Z"/>
      </g>
      <use href="#petal-set" transform="rotate(30)"/>
      <use href="#petal-set" transform="rotate(60)"/>
      <use href="#petal-set" transform="rotate(90)"/>
      <use href="#petal-set" transform="rotate(120)"/>
      <use href="#petal-set" transform="rotate(150)"/>
      <use href="#petal-set" transform="rotate(180)"/>
      <use href="#petal-set" transform="rotate(210)"/>
      <use href="#petal-set" transform="rotate(240)"/>
      <use href="#petal-set" transform="rotate(270)"/>
      <use href="#petal-set" transform="rotate(300)"/>
      <use href="#petal-set" transform="rotate(330)"/>
    </g>

    <circle r="112" fill="none" stroke="url(#goldSoft)"
            stroke-width="2.5" opacity="0.35"/>

    <g fill="url(#gold)">
      <polygon points="0,-132 30,-30 132,0 30,30 0,132 -30,30 -132,0 -30,-30"/>
      <polygon points="0,-132 30,-30 132,0 30,30 0,132 -30,30 -132,0 -30,-30"
               transform="rotate(45)" opacity="0.7"/>
    </g>

    <circle r="26" fill="#0d0e17"/>
    <circle r="20" fill="url(#gold)"/>
    <circle r="8"  fill="#fff3d4"/>
  </g>
</svg>
